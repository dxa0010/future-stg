<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="縦スクロール・ローグライトSTG プロトタイプ（攻めの回避とリスクを背負った溜め）" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>RESONANCE FLICK — 縦スクロール・ローグライトSTG プロトタイプ</title>
  </head>
  <body>
    <div id="wrap">
      <div id="canvas-mount"></div>

      <!-- 溜めを保持している間だけ出る解放ボタン -->
      <button id="release-btn" class="hidden" type="button" aria-label="臨界共鳴を解放">
        <span class="ring"></span>
        <span class="label">解放</span>
      </button>

      <button id="pause-btn" type="button" aria-label="ポーズ">| |</button>

      <div id="screen" class="screen hidden"></div>
      <div id="crt" class="hidden"></div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
